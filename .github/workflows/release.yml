name: CD - Build and Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17 for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Install .NET MAUI Android workload
        run: dotnet workload install android

      - name: Install Android SDK and accept licenses
        run: dotnet build GuitarTabApp.Mobile/GuitarTabApp.Mobile.csproj -t:InstallAndroidDependencies -f net11.0-android -p:AndroidSdkDirectory="$HOME/android-sdk" -p:AcceptAndroidSDKLicenses=True

      - name: Build and Publish Android APK
        run: dotnet publish GuitarTabApp.Mobile/GuitarTabApp.Mobile.csproj -f net11.0-android -c Release -p:AndroidSdkDirectory="$HOME/android-sdk" -p:AndroidPackageFormat=apk -o ./publish

      - name: Rename APK with version tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          APK_FILE=$(find ./publish -name "*-Signed.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find ./publish -name "*.apk" | head -n 1)
          fi
          mv "$APK_FILE" "./publish/GuitarTabApp-${TAG_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./publish/GuitarTabApp-*.apk
          generate_release_notes: true