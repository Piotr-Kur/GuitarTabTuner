name: CI - Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore dependencies
        run: dotnet restore GuitarTabApp.Tests/GuitarTabApp.Tests.csproj

      - name: Build Core and Tests
        run: dotnet build GuitarTabApp.Tests/GuitarTabApp.Tests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test GuitarTabApp.Tests/GuitarTabApp.Tests.csproj --configuration Release --no-build --verbosity normal